name: Build & Release Multiplatform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Publish as draft release'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-quota:
    name: Quota & Visibility Preflight Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify Repository Visibility & Runner Quota
        run: |
          echo "============================================================"
          echo "Repository: ${{ github.repository }}"
          echo "Visibility: ${{ github.event.repository.private && 'PRIVATE' || 'PUBLIC' }}"
          echo "============================================================"
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "⚠️ WARNING: Repository is PRIVATE."
            echo "Private repository runs consume billable Actions minutes (macOS: 10x multiplier)."
            if [ "${{ vars.ALLOW_PRIVATE_BUILDS }}" != "true" ] && [ "${{ secrets.ALLOW_PRIVATE_BUILDS }}" != "true" ]; then
              echo "❌ RELEASE BUILD BLOCKED: Repository is private and ALLOW_PRIVATE_BUILDS is not set."
              echo "Keep the repository public for 100% free runner minutes, or set secret/variable ALLOW_PRIVATE_BUILDS=true."
              exit 1
            else
              echo "ℹ️ ALLOW_PRIVATE_BUILDS is enabled. Proceeding with release build."
            fi
          else
            echo "✅ PASS: Repository is PUBLIC. Standard GitHub runners are 100% FREE with unlimited minutes."
          fi

  build-windows:
    name: Build Windows Installers (x64)
    needs: check-quota
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Generate master application icons
        run: npm run generate-icons

      - name: Build Windows NSIS & Portable executables
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

  build-macos:
    name: Build macOS Installers (arm64)
    needs: check-quota
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Generate master application icons
        run: npm run generate-icons

      - name: Build macOS DMG & Zip bundles
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}


      - name: Upload macOS Installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag_name || 'v1.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: StickerChest ${{ steps.tag_info.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
